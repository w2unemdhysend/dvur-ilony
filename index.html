<style>
/* Leták vernacular: cool newsprint paper, print-blue ink, price-tag yellow, sale red.
   One loud element, the week strip (the leták rhythm of the town); everything else is a quiet coupon sheet. */
:root{
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  --bg:#E9ECE6; --surface:#FAFBF7; --ink:#1B2330; --muted:#556070; --line:#C9CFC6; --ctl:#7E8781; --mk-edge:#1B2330;
  --tag:#FFD23F; --tag-ink:#1B2330; --tag-soft:#FFF0B3; --sale:#C8102E; --accent:#C8102E;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F1216; --surface:#181C22; --ink:#ECEFE8; --muted:#9BA5B1; --line:#2C333D; --ctl:#6B7480; --mk-edge:transparent; --tag-soft:#3A3318; --sale:#FF6B7D; --accent:#FF6B7D; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0F1216; --surface:#181C22; --ink:#ECEFE8; --muted:#9BA5B1; --line:#2C333D; --ctl:#6B7480; --mk-edge:transparent; --tag-soft:#3A3318; --sale:#FF6B7D; --accent:#FF6B7D; color-scheme:dark; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--f-body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button,input{font:inherit;color:inherit}
/* iPhone: no grey tap flash (buttons have their own pressed state), and no native rounded search field */
a,button,summary{-webkit-tap-highlight-color:transparent}
input[type=search]{-webkit-appearance:none;appearance:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto}
.top{padding-block:16px 4px}
h1{font-family:var(--f-display);font-weight:800;font-size:48px;line-height:.92;margin:0 0 10px;letter-spacing:-.005em}
.lede{margin:0;color:var(--muted);font-size:16px;max-width:42ch}
h2{font-family:var(--f-display);font-weight:700;font-size:27px;line-height:1;margin:0}
main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:14px}

/* the week strip: Mon..Sun of this week in Prague time, today inverted, a yellow price-tag bar under days when new flyers start */
.week{display:grid;gap:10px}
.days{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{display:grid;justify-items:center;gap:2px;padding:8px 0 9px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.day .dn{font-size:13px;line-height:1;color:var(--muted)}
.day .dd{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1}
.day .mk{width:22px;height:6px;border-radius:2px;background:transparent}
.day.change .mk{background:var(--tag);box-shadow:0 0 0 1px var(--mk-edge)}
.day.today.change .mk{box-shadow:none}
.day.today{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.today .dn{color:inherit;opacity:.8}
.weeksum{margin:0;font-size:16px;line-height:1.4}
.weeksum b{font-weight:600}

/* search across all chains (kupi.cz) */
.find{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.find label{display:block;font-weight:600;font-size:16px;margin-bottom:8px}
.find .row{display:flex;gap:8px}
.find input{flex:1;min-width:0;min-height:48px;padding:0 14px;border-radius:10px;border:1px solid var(--ctl);background:var(--bg);font-size:17px}
.find input::placeholder{color:var(--muted);opacity:1}
.find p{margin:10px 0 8px;font-size:14px;line-height:1.4;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:44px;padding:4px 12px;border-radius:10px;border:1px solid var(--ctl);background:transparent;cursor:pointer;text-align:left;line-height:1.2}
.chip b{font-weight:600;font-size:15px}
.chip small{font-size:12px;color:var(--muted)}
.hint{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--tag-soft);font-size:14px;line-height:1.4}
.hint svg{flex:none;width:18px;height:18px;margin-top:1px}
.hint p{margin:0;color:var(--ink)}
.hint button{display:block;margin-top:2px;padding:0;min-height:44px;border:0;background:none;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* the coupon sheet: one surface, chains separated by perforation lines */
#list{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.chain{padding:16px 14px 14px}
.chain + .chain{border-top:1.5px dashed var(--line)}
.chain .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.chain .kind{font-size:14px;color:var(--muted);text-align:right}
.when{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:var(--muted)}
.when svg{width:16px;height:16px;flex:none}
.tag{display:inline-flex;align-items:center;margin-top:8px;padding:3px 10px 3px 14px;font-weight:600;font-size:14px;line-height:1.3;color:var(--tag-ink);background:var(--tag);
  clip-path:polygon(7px 0,100% 0,100% 100%,7px 100%,0 50%)}
.tag.soon{background:var(--tag-soft);color:var(--ink)}
.stores{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.store{display:flex;align-items:center;gap:8px;font-size:16px;line-height:1.3}
.store > span{min-width:0;flex:1}
.store small{display:block;color:var(--muted);font-size:14px}
.pin{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--ctl);display:grid;place-items:center;color:var(--ink)}
.pin svg{width:20px;height:20px}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:10px;border:0;cursor:pointer;
  background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;text-decoration:none;white-space:nowrap;flex:none}
.go svg{width:18px;height:18px}
.go.small{min-height:44px;padding:0 12px;font-size:15px;background:transparent;color:var(--ink);border:1px solid var(--ctl)}
.chain > .go{width:100%;margin-top:12px}
.note{margin:10px 0 0;font-size:15px;line-height:1.4;color:var(--muted)}
.extra{display:inline-flex;align-items:center;min-height:44px;font-size:15px;color:var(--ink);text-underline-offset:3px}

.how{margin:0;font-size:15px;color:var(--muted)}
.gloss{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px}
.gloss summary{cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:16px;list-style:none}
.gloss summary::-webkit-details-marker{display:none}
.gloss summary svg{flex:none;width:20px;height:20px;transition:transform .25s ease}
.gloss[open] summary svg{transform:rotate(180deg)}
.gloss dl{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px;line-height:1.35}
.gloss dt{font-weight:600}
.gloss dd{margin:0;color:var(--muted)}
.foot{margin-top:16px;font-size:13px;color:var(--muted)}
@media (min-width:480px){h1{font-size:58px}}
</style>

  var GLOSS = [['leták', 'рекламний проспект з акціями'], ['akce, v akci', 'акція, зі знижкою'], ['sleva', 'знижка'], ['běžná cena', 'звичайна ціна'],
    ['platí od … do …', 'діє з … по …'], ['od středy', 'із середи'], ['s kartou, s aplikací', 'лише з карткою чи додатком магазину'],
    ['ks (kus)', 'штука'], ['cena za 1 kg', 'ціна за кілограм'], ['Kč', 'чеська крона (CZK)'], ['Vyberte prodejnu', 'виберіть магазин'], ['Zobrazit leták', 'показати проспект']];
  var CAT_KEY = 'dvur-cat', HINT_KEY = 'dvur-kupi-hint';
  var tg = window.UI && UI.tg;
  if (tg){ try { tg.ready(); tg.expand(); } catch(e){} }

  var ARROW = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg>';
  var PIN = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
  var CAL = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>';
  var esc = function(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'}[c]; }); };
  var link = function(url, html, cls, label){ return '<a class="' + cls + '" href="' + esc(url) + '" target="_blank" rel="noopener"' + (label ? ' aria-label="' + esc(label) + '"' : '') + '>' + html + '</a>'; };
  var tr = function(v, l){ return v && typeof v === 'object' ? v[l] : (v || ''); };
  var mapUrl = function(chain, street){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(chain + ', ' + street + ', 544 01 Dvůr Králové nad Labem'); };
  var kupi = function(q){ return 'https://www.kupi.cz/hledej?f=' + encodeURIComponent(q); };
  var get = function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } };
  var put = function(k, v){ try { localStorage.setItem(k, v); } catch(e){} };

  // Today in Dvůr Králové (Europe/Prague), whatever the phone's own time zone: weekday 0 = Monday, and this week's Monday..Sunday dates
  function pragueWeek(){
    var p = {};
    new Intl.DateTimeFormat('en-US', {timeZone: 'Europe/Prague', year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'short'})
      .formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
    var dow = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].indexOf(p.weekday);
    var base = Date.UTC(+p.year, +p.month - 1, +p.day);
    var dates = [];
    for (var i = 0; i < 7; i++){ var d = new Date(base + (i - dow) * 864e5); dates.push([d.getUTCDate(), d.getUTCMonth() + 1]); }
    return {dow: dow, dates: dates};
  }
  // which chains start a new flyer on weekday d
  function startingOn(d){ return CHAINS.filter(function(c){ return c.cycle && CYCLES[c.cycle].indexOf(d) >= 0; }).map(function(c){ return c.name; }); }
  // status of a chain's flyer today: 'today', 'tomorrow' or null
  function status(c, dow){
    if (!c.cycle) return null;
    if (CYCLES[c.cycle].indexOf(dow) >= 0) return 'today';
    if (CYCLES[c.cycle].indexOf((dow + 1) % 7) >= 0) return 'tomorrow';
    return null;
  }

  function renderWeek(l){
    var t = T[l], w = pragueWeek();
    document.getElementById('days').innerHTML = w.dates.map(function(dt, i){
      var names = startingOn(i);
      var label = DAYS_FULL[l][i] + ' ' + dt[0] + '. ' + dt[1] + '.' + (i === w.dow ? ', ' + t.today.toLowerCase() : '') + (names.length ? ': ' + names.join(', ') : '');
      return '<li class="day' + (i === w.dow ? ' today' : '') + (names.length ? ' change' : '') + '"' + (i === w.dow ? ' aria-current="date"' : '') + '>' +
        '<span class="sr">' + esc(label) + '</span><span class="dn" aria-hidden="true">' + DAYS[l][i] + '</span><span class="dd" aria-hidden="true">' + dt[0] + '</span><span class="mk" aria-hidden="true"></span></li>';
    }).join('');
    var now = startingOn(w.dow), soon = startingOn((w.dow + 1) % 7), parts = [];
    if (now.length) parts.push(t.sumToday + ': <b>' + now.map(esc).join(', ') + '</b>.');
    if (soon.length) parts.push(t.sumTomorrow + ': <b>' + soon.map(esc).join(', ') + '</b>.');
    if (!parts.length){
      for (var k = 2; k < 8; k++){ var d = (w.dow + k) % 7, n = startingOn(d); if (n.length){ parts.push(t.next + ' ' + ON_DAY[l][d] + ': <b>' + n.map(esc).join(', ') + '</b>.'); break; } }
    }
    document.getElementById('weeksum').innerHTML = parts.join(' ');
    return w.dow;
  }

  function renderList(cat, l, dow){
    var t = T[l];
    document.getElementById('list').innerHTML = CHAINS.filter(function(c){ return c.cat === cat; }).map(function(c){
      var rows = c.stores.map(function(s){
        var small = tr(s[2], l);
        return '<li class="store"><span>' + esc(s[0]) + (small ? '<small>' + esc(small) + '</small>' : '') + '</span>' +
          link(mapUrl(c.name, s[0]), PIN, 'pin', c.name + ', ' + s[0] + ': ' + t.map) +
          (s[1] ? link(s[1], esc(t.flyerStore) + ' ' + ARROW, 'go small', t.flyerStore + ' ' + (small || c.name) + ', ' + s[0]) : '') + '</li>';
      }).join('');
      var st = status(c, dow), lidl = c.cycle === 'lidl', when = '';
      if (st === 'today') when = '<span class="tag">' + esc(lidl ? t.lidlToday : t.newToday) + '</span>';
      else if (st === 'tomorrow') when = '<span class="tag soon">' + esc(lidl ? t.lidlTomorrow : t.newTomorrow) + '</span>';
      else if (c.cycle) when = '<div class="when">' + CAL + '<span>' + esc(lidl ? t.lidlIdle : t.everyWed) + '</span></div>';
      else if (c.when) when = '<div class="when">' + CAL + '<span>' + esc(tr(c.when, l)) + '</span></div>';
      var btn = c.btn ? tr(c.btn, l) : t.flyer;
      return '<section class="chain" aria-label="' + esc(c.name) + '"' + (st ? ' data-status="' + st + '"' : '') + '>' +
        '<div class="head"><h2>' + esc(c.name) + '</h2>' + (c.kind ? '<span class="kind">' + esc(tr(c.kind, l)) + '</span>' : '') + '</div>' + when +
        '<ul class="stores">' + rows + '</ul>' +
        (c.url ? link(c.url, esc(btn) + ' ' + ARROW, 'go', btn + ': ' + c.name) : '') +
        (c.note ? '<p class="note">' + esc(tr(c.note, l)) + '</p>' : '') +
        (c.extra ? link(c.extra[1], esc(tr(c.extra[0], l)), 'extra') : '') + '</section>';
    }).join('');
  }

  function renderCats(cat, l){
    var seg = document.getElementById('cats');
    var thumb = seg.querySelector('.thumb');
    seg.innerHTML = '';
    seg.appendChild(thumb);
    CATS.forEach(function(c){
      var b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-cat', c[0]); b.setAttribute('aria-pressed', String(c[0] === cat));
      b.textContent = l === 'cs' ? c[2] : c[1];
      seg.appendChild(b);
    });
    UI.place(seg, true);
  }

  function renderStatic(l){
    var t = T[l];
    document.title = t.title;
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function(el){ el.textContent = t[el.getAttribute('data-t')]; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-t-ph]'), function(el){ el.placeholder = t[el.getAttribute('data-t-ph')]; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-t-aria]'), function(el){ el.setAttribute('aria-label', t[el.getAttribute('data-t-aria')]); });
    document.getElementById('chips').innerHTML = CHIPS.map(function(c){
      return '<button class="chip" type="button" data-q="' + esc(c[0]) + '"><b lang="cs">' + esc(c[0]) + '</b>' + (l === 'uk' ? '<small>' + esc(c[1]) + '</small>' : '') + '</button>';
    }).join('');
    document.getElementById('hint').hidden = get(HINT_KEY) === 'ok';
    // the glossary explains Czech words to a Ukrainian reader; in Czech it is not needed
    document.getElementById('gloss').hidden = l !== 'uk';
    document.getElementById('glosslist').innerHTML = GLOSS.map(function(g){ return '<dt lang="cs">' + esc(g[0]) + '</dt><dd>' + esc(g[1]) + '</dd>'; }).join('');
  }

  var cat = 'food', dow = 0;
  var sc = get(CAT_KEY); if (CATS.some(function(c){ return c[0] === sc; })) cat = sc;
  function renderAll(){ var l = UI.lang(); renderStatic(l); dow = renderWeek(l); renderCats(cat, l); renderList(cat, l, dow); }
  renderAll();
  document.addEventListener('langchange', renderAll);
  // the app may stay open past midnight: refresh the week when it comes back to the screen
  document.addEventListener('visibilitychange', function(){ if (!document.hidden && pragueWeek().dow !== dow) renderAll(); });

  function open(url){
    if (tg && tg.openLink){ try { tg.openLink(url); return; } catch(e){} }
    var w = window.open(url, '_blank', 'noopener'); if (!w) location.href = url;
  }
  document.getElementById('cats').addEventListener('click', function(e){
    var b = e.target.closest('button[data-cat]'); if (!b) return;
    var c = b.getAttribute('data-cat'); if (c === cat) return;
    cat = c; put(CAT_KEY, c);
    UI.press(this, 'data-cat', c);
    renderList(c, UI.lang(), dow);
    UI.haptic();
  });
  document.getElementById('find').addEventListener('submit', function(e){
    e.preventDefault();
    var q = document.getElementById('q').value.trim();
    if (!q){ document.getElementById('q').focus(); return; }
    document.getElementById('q').blur();
    open(kupi(q));
  });
  document.getElementById('chips').addEventListener('click', function(e){
    var b = e.target.closest('button[data-q]'); if (!b) return;
    document.getElementById('q').value = b.getAttribute('data-q');
    UI.haptic();
    open(kupi(b.getAttribute('data-q')));
  });
  document.getElementById('hintok').addEventListener('click', function(){
    put(HINT_KEY, 'ok');
    document.getElementById('hint').hidden = true;
    document.getElementById('q').focus({preventScroll: true});
  });
  // Inside Telegram the chain sites open in the phone's browser: they remember the chosen store there
  document.getElementById('list').addEventListener('click', function(e){
    var a = e.target.closest('a[href]'); if (!a || !tg || !tg.openLink) return;
    e.preventDefault(); open(a.href);
  });
})();
</script>
</body>
</html>
